services:
  mlflow:
    build: ./mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow-data

  inference:
    build: .
    network_mode: "service:mlflow"
    environment:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    volumes:
      - mlflow-data:/mlflow-data
    depends_on:
      - mlflow

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      INFERENCE_URL: http://mlflow:8000
    depends_on:
      - inference

volumes:
  mlflow-data: